heroImageIdea: >
  Foto cercana de un bebé o niño pequeño (12-24 meses) en momento cotidiano:
  jugando con un mordedor, explorando un objeto con la boca, o sonriendo con
  un poco de babeo natural. Tono cálido, luz natural. Evitar imágenes
  clínicas o de stock genérico tipo "bebé en consulta".
