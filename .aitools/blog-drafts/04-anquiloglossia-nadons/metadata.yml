val:
  title: "L'anquiloglòssia en nadons (fre lingual curt): quan és un problema i quan no"
  slug: anquiloglossia-fre-lingual-curt-nadons
  description: "Un fre lingual visible no és sempre un problema. T'expliquem què és l'anquiloglòssia, els senyals que conviden a valorar-la i quan val la pena intervindre."
  heroImageAlt: "Logopeda valorant la lactància d'un nadó nounat a València"

es:
  title: "La anquiloglosia en bebés (frenillo lingual corto): cuándo es un problema y cuándo no"
  slug: anquiloglosia-frenillo-lingual-corto-bebes
  description: "Un frenillo lingual visible no siempre es un problema. Te explicamos qué es la anquiloglosia, las señales que invitan a valorarla y cuándo conviene intervenir."
  heroImageAlt: "Logopeda neonatal valorando la lactancia de un bebé recién nacido en Valencia"

heroImageIdea: >
  Foto cercana de una madre con su bebé recién nacido (0-2 meses) en una
  sesión de valoración de lactancia. La logopeda puede aparecer en segundo
  plano o sugerirse por contexto (camilla, escritorio profesional discreto).
  Luz natural, ambiente cálido, sin connotación clínica fría. Evitar imágenes
  de stock genéricas de "bebé recién nacido en hospital".

seoNotes: >
  Artículo orientado a posicionar para búsquedas locales tipo
  "logopeda neonatal Valencia", "anquiloglosia bebé Valencia",
  "frenillo lingual corto recién nacido", "dolor lactancia logopeda".
  La frase "logopeda neonatal" aparece de forma natural en VAL y ES
  varias veces a lo largo del cuerpo. La mención a Valencia se hace
  únicamente en el CTA final, sin forzar el cuerpo del artículo.
