name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false  # never cancel an in-progress deploy

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed_urls: ${{ steps.changed.outputs.urls }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historial completo: el lastmod del sitemap sale de git
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
        env:
          PUBLIC_BOOKING_API_URL: ${{ secrets.BOOKING_API_URL }}
      # Antes de desplegar: URLs nuevas o con lastmod distinto respecto al sitemap publicado.
      - name: URLs cambiadas para IndexNow
        id: changed
        run: node scripts/indexnow.mjs --changed dist/sitemap-0.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # En cada push envía solo lo cambiado (y se salta si no hay nada); lanzado a mano
  # (workflow_dispatch) envía todo el sitemap publicado.
  indexnow:
    needs: [build, deploy]
    if: github.event_name == 'workflow_dispatch' || needs.build.outputs.changed_urls != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      - name: Notify IndexNow
        run: node scripts/indexnow.mjs
        env:
          INDEXNOW_URLS: ${{ github.event_name != 'workflow_dispatch' && needs.build.outputs.changed_urls || '' }}
